##################################################
# NextGen MIS - Containerised architecture       #
# - postgres       = Gold (warehouse DB)         #
# - backend        = Flask API (stateless)       #
# - bronze-etl     = Bronze compute container    #
# - silver-etl     = Silver compute container    #
# - gold-etl       = Gold compute container      #
# - frontend       = React SPA                   #
# - bronze/silver/gold = shared volumes          #
##################################################

services:
  postgres:
    image: postgres:16-alpine
    container_name: nextgen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ucu_datawarehouse
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # First boot only: creates airflow_meta alongside ucu_datawarehouse (reproducible Airflow DB)
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextgen_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Point the backend API at the PostgreSQL warehouse container
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: postgres
      # Flask secrets – override in production
      SECRET_KEY: "change-me-in-prod"
      JWT_SECRET_KEY: "change-me-in-prod-too"
      # ETL log timestamps use this timezone (e.g. Africa/Kampala); omit for UTC
      ETL_LOG_TZ: "Africa/Kampala"
    ports:
      - "5000:5000"
    volumes:
      # Mount the backend source for live reload in development
      - ./backend:/app

  # Jupyter on the same image/env as the API — run training notebooks against the warehouse from inside Docker.
  # Start: docker compose --profile notebooks up -d backend-jupyter
  # Open:  http://localhost:8888/lab?token=dev  (change JUPYTER_TOKEN in production)
  backend-jupyter:
    profiles: ["notebooks"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextgen_backend_jupyter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: postgres
      JUPYTER_TOKEN: dev
    ports:
      - "8888:8888"
    volumes:
      - ./backend:/app
    working_dir: /app
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.root_dir=/app

  bronze-etl:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextgen_bronze_etl
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Bronze ETL uses the same database connection (for any metadata it needs)
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: postgres
      ETL_PHASE: "bronze"
    volumes:
      # Share code and data directories so parquet files land in the bronze volume
      - ./backend:/app
      - bronze_data:/app/data/bronze

  silver-etl:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextgen_silver_etl
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: postgres
      ETL_PHASE: "silver"
    volumes:
      - ./backend:/app
      - bronze_data:/app/data/bronze
      - silver_data:/app/data/silver

  gold-etl:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextgen_gold_etl
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: postgres
      ETL_PHASE: "gold"
    volumes:
      - ./backend:/app
      - bronze_data:/app/data/bronze
      - silver_data:/app/data/silver
      - gold_data:/app/data/gold

  airflow:
    image: apache/airflow:2.10.2
    container_name: nextgen_airflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow_meta
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # Reproducible admin (override via .env or shell: AIRFLOW_ADMIN_USERNAME / AIRFLOW_ADMIN_PASSWORD)
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-ensubuga019@gmail.com}
      # Create a reusable connection pointing at the warehouse DB
      AIRFLOW_CONN_NEXTGEN_POSTGRES: postgresql+psycopg2://postgres:postgres@postgres:5432/ucu_datawarehouse
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    # Idempotent: migrate DB, create admin on first run, reset password on subsequent runs (same creds every compose up)
    command:
      - bash
      - -c
      - |
          set -e
          airflow db migrate
          U="$${AIRFLOW_ADMIN_USERNAME:-admin}"
          P="$${AIRFLOW_ADMIN_PASSWORD:-admin}"
          E="$${AIRFLOW_ADMIN_EMAIL:-ensubuga019@gmail.com}"
          if airflow users create \
            --username "$$U" \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email "$$E" \
            --password "$$P"; then
            echo "Airflow admin user created ($$U)"
          else
            airflow users reset-password --username "$$U" --password "$$P" || true
          fi
          exec airflow webserver

  airflow-scheduler:
    image: apache/airflow:2.10.2
    container_name: nextgen_airflow_scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow_meta
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_CONN_NEXTGEN_POSTGRES: postgresql+psycopg2://postgres:postgres@postgres:5432/ucu_datawarehouse
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    command: >
      bash -c "airflow db migrate && exec airflow scheduler"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextgen_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # setupProxy.js proxies /api to this URL (package.json "proxy" is localhost for host dev)
      CHOKIDAR_USEPOLLING: "true"
      # Proxy target for /api when running React dev server in Docker
      PROXY_TARGET: "http://backend:5000"
    tty: true
    stdin_open: true
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - ./frontend/.env:/app/.env

volumes:
  pg_data:
  bronze_data:
  silver_data:
  gold_data:
